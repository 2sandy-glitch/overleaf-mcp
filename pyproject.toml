[project]
name = "overleaf-mcp"
version = "0.0.2"
description = "Generic MCP server for editing Overleaf LaTeX projects from Claude Code"
readme = "README.md"
authors = [
    { name = "Santhosh", email = "santhosh@ectrons.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.2",
    "websocket-client>=1.9.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts/testsuite"]
python_files = ["s_*.py"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
